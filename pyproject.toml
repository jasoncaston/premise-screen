[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "premise-screen"
version = "0.1.0"
description = "A categorical screen for rejecting weak product premises"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Jason Caston"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
premise-screen = "premise_screen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
